name: DQI transposed middle product and retained norm
on:
  pull_request:
    paths:
      - 'research/dqi_cutoff18_strict/TransposedMiddle.lean'
      - 'research/dqi281_joint_transpose/**'
      - '.github/workflows/dqi281-transposed-middle.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lean:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: research/dqi_cutoff18_strict
    steps:
      - uses: actions/checkout@v4
      - run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain leanprover/lean4:v4.35.0
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - run: |
          set -euo pipefail
          lake update
          lake exe cache get
          lake env lean -DwarningAsError=true TransposedMiddle.lean | tee transpose.log
          test "$(grep -c 'GVQCC.TransposedMiddle.*axiom' transpose.log)" -eq 12
          ! grep -E 'sorryAx|ofReduceBool' transpose.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: transposed-middle-axioms
          path: research/dqi_cutoff18_strict/transpose.log
