name: GVQCC actual-KMB global-signfield compiler-loss search

on:
  push:
    branches:
      - research/claude-handoff-global-angle-20261123
  workflow_dispatch:

permissions:
  contents: read

jobs:
  actual-kmb-cost-guided-search:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned NumPy
        run: python -m pip install --disable-pip-version-check numpy==2.3.5
      - name: Restore exact pinned 1219x75 V8 words and tree, with SHA256 proof
        run: |
          python - <<'PY'
          import json,hashlib,base64,zlib,numpy as np
          from pathlib import Path
          f=json.loads(Path('research/claude_handoff_20261123/fixtures/V8_C46_angles_edges_b85.json').read_text())
          raw=zlib.decompress(base64.b85decode(f['payload']))
          assert hashlib.sha256(raw).hexdigest()==f['raw_sha256']
          m=int(np.prod(f['shape_words']))
          w=np.frombuffer(raw[:m],dtype=np.uint8).reshape(f['shape_words']).copy()
          e=np.frombuffer(raw[m:],dtype=np.uint8).reshape(f['shape_edges']).copy()
          assert w.shape==(1219,75) and e.shape==(75,2)
          np.savez_compressed('publicV8_angle_only.npz',angle_words=w,tree_edges=e)
          print('PASS original V8 angle-table payload SHA256:',f['raw_sha256'])
          PY
      - name: Search six global Walsh sign fields by actual KMB Toffoli costs
        env:
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
        run: |
          python research/claude_handoff_20261123/src/signfield_cost_search.py \
            --source publicV8_angle_only.npz --out experiment_output \
            --masks 1,16,128,257,1024,2047 --keep-finalists 2
      - name: Validate physical sign equivalence and final exact KMB phase
        run: |
          python - <<'PY'
          import json,pathlib
          root=pathlib.Path('experiment_output')
          r=json.loads((root/'signfield_cost_search.json').read_text())
          assert r['mask_candidates']==6
          assert r['first_bank_all_compiled']
          assert 'baseline' in r['verified_finalists']
          for item in r['records']:
              assert item['output_vector_err']<1e-13
              assert item['NPZ_sha256'] and item['bank0_kmb_sha256']
          for item in r['records']:
              if item['name'] in r['verified_finalists']:
                  assert item['bank3_exact_phase_dirty_and_scratch']
                  assert len(item['bank3_kmb_SHA256'])==3
          assert r['native_KickMix_executed'] is False
          print('PASS exact local value/HMR-phase/dirty-word and checksum receipts')
          print(json.dumps({'first_bank':{v['name']:v['bank0_T'] for v in r['records']},
             'finalists':{v['name']:v.get('bank3_T') for v in r['records'] if 'bank3_T' in v}},indent=2))
          PY
      - name: Retain generated KMB + NPZ + SHA256 + raw scorecard
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gvqcc-global-signfield-actual-compiled-KMB
          path: experiment_output/
          if-no-files-found: warn
          retention-days: 14
