name: V11 dual phase bridge Lean
on:
  push:
    branches: [research/invsqrt36-v11-dual-phase-bridge-20261124]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lean:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean 4.35.0
        run: |
          curl -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain leanprover/lean4:v4.35.0
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Check actual gate lists and resource certificates
        run: lean research/invsqrt36_nonlinear_lending/lean/DualPhaseBridgeV11.lean
