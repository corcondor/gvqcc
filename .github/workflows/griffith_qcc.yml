name: Griffith-QCC exact XAG smoke
on:
  pull_request:
    paths:
      - 'research/griffith_qcc/**'
      - '.github/workflows/griffith_qcc.yml'
  workflow_dispatch:
jobs:
  xag-exact:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install experimental package
        run: python -m pip install -e "research/griffith_qcc[chem]"
      - name: Run exact validation tests
        working-directory: research/griffith_qcc
        run: python -m unittest discover -s tests -v
