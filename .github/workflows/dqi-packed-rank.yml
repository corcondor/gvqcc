name: Packed rank continuant algebra audit
on:
  pull_request:
    paths:
      - 'research/dqi_packed_rank/**'
      - '.github/workflows/dqi-packed-rank.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reference:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python research/dqi_packed_rank/certificate.py
  lean:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain leanprover/lean4:v4.35.0
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - run: |
          set -euo pipefail
          lean research/dqi_packed_rank/PackedRank.lean | tee lean.log
          ! grep -q 'sorryAx' lean.log
