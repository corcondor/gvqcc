name: OSS chained XAG integration
on:
  push:
    branches: [experiment/oss-chained-xag-20261123]
  pull_request:
    paths:
      - 'third_party/manwithacat/**'
      - 'experiments/oss_chained_angle/**'
      - '.github/workflows/oss-chained-xag.yml'
permissions:
  contents: read
jobs:
  exact-logic:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Prepare Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install NumPy
        run: python -m pip install numpy==2.1.3
      - name: Compile upstream and adapter
        run: python -m compileall -q third_party/manwithacat/chained_and.py experiments/oss_chained_angle/bridge.py
      - name: Run unchanged upstream regression tests
        run: python third_party/manwithacat/test_chained_and.py -v
      - name: Run actual V8 8-row fixture and multi-level CNF generation
        run: |
          python experiments/oss_chained_angle/bridge.py \
            experiments/oss_chained_angle/fixture_k8_4out_8rows.json \
            --out outputs/oss_chained_k8.json --cnf outputs/oss_chained_k8_4and.cnf \
            --rows 2 --k 4 --chained 1
      - name: Save evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chained-xag-experimental-evidence
          path: outputs/
          if-no-files-found: ignore
