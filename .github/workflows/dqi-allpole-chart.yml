name: DQI all-pole projective chart local algebra
on:
  pull_request:
    paths:
      - 'research/dqi_cutoff18_strict/AllPoleChart.lean'
      - '.github/workflows/dqi-allpole-chart.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lean:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain leanprover/lean4:v4.35.0
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Strict inherited and new local proofs
        working-directory: research/dqi_cutoff18_strict
        run: |
          set -euo pipefail
          lake update
          lake exe cache get
          lake env lean -DwarningAsError=true -o InvariantPad.olean InvariantPad.lean
          LEAN_PATH=. lake env lean -DwarningAsError=true AllPoleChart.lean | tee allpole-axioms.txt
          test "$(grep -c 'GVQCC.AllPoleChart.*axiom' allpole-axioms.txt)" -eq 6
          ! grep -Eq 'sorryAx|ofReduceBool' allpole-axioms.txt
