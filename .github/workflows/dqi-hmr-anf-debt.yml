name: HMR debt strict Lean check
on:
  pull_request:
    paths:
      - 'research/dqi_hmr_anf_debt/**'
      - '.github/workflows/dqi-hmr-anf-debt.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lean:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain leanprover/lean4:v4.35.0
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - run: |
          set -euo pipefail
          lean --version
          lean -DwarningAsError=true research/dqi_hmr_anf_debt/HMRDebt.lean | tee hmr-debt-axioms.log
          test "$(grep -Ec 'GVQCC.HMR(Debt|Graph).*axiom' hmr-debt-axioms.log)" -eq 17
          ! grep -E 'sorryAx|ofReduceBool|native_decide' hmr-debt-axioms.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hmr-debt-axioms
          path: hmr-debt-axioms.log
