name: GVQCC public V8 sparse W Lean certificate
on:
  push:
    branches:
      - research/lean-sparse-w-20261124
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sparse-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    env:
      OPENBLAS_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install NumPy (data reader only)
        run: python -m pip install numpy==2.3.5
      - name: Generate concrete Lean certificate from SHA-pinned W
        run: |
          python research/lean_sparse_w_20261124/generate_sparse_w_lean.py \
            --support-b64 research/lean_sparse_w_20261124/public_v8_W_support_zlib.b64 \
            --lean research/lean_sparse_w_20261124/SparseWCERT.lean
          if grep -En '(^|[[:space:]])(sorry|axiom|native_decide)([[:space:]]|$)' \
              research/lean_sparse_w_20261124/SparseWCERT.lean; then exit 1; fi
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: research/lean_sparse_w_20261124
          build: true
          test: false
          lint: false
          use-mathlib-cache: false
      - name: Emit certificate and summary as read-only artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: public-v8-sparse-W-lean-certificate
          path: |
            research/lean_sparse_w_20261124/SparseWCERT.lean
            research/lean_sparse_w_20261124/SparseWCERT.json
          if-no-files-found: warn
          retention-days: 30
