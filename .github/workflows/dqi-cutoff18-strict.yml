name: DQI cutoff18 strict repair algebra
on:
  pull_request:
    paths:
      - 'research/dqi_cutoff18_strict/**'
      - '.github/workflows/dqi-cutoff18-strict.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lean:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: research/dqi_cutoff18_strict
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain leanprover/lean4:v4.35.0
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Kernel and axiom audit
        run: |
          set -euo pipefail
          lake update
          lake exe cache get
          lake env lean -DwarningAsError=true CutoffRepair.lean | tee proof.log
          test "$(grep -c 'GVQCC.CutoffRepair.*axiom' proof.log)" -eq 8
          lake env lean -DwarningAsError=true RollingCutoff.lean | tee rolling.log
          test "$(grep -c 'GVQCC.RollingCutoff.*axiom' rolling.log)" -eq 6
          ! grep -E 'sorryAx|ofReduceBool' proof.log rolling.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cutoff18-axioms
          path: |
            research/dqi_cutoff18_strict/proof.log
            research/dqi_cutoff18_strict/rolling.log
