name: DQI344 HMR factor local laws
on:
  pull_request:
    paths:
      - 'research/dqi344/**'
      - '.github/workflows/dqi344-hmr-factor.yml'
jobs:
  lean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean
        run: |
          curl -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o elan-init.sh
          sh elan-init.sh -y --default-toolchain leanprover/lean4:v4.35.0
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Verify local identities
        run: |
          set -o pipefail
          lean --version
          lean -DwarningAsError=true research/dqi344/HMRFactor.lean | tee lean.log
          ! grep -E 'sorryAx|ofReduceBool' lean.log
