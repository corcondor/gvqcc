name: Abel Syndrome V33 Lean
on:
  pull_request:
    paths:
      - 'research/invsqrt36_v33_abel_syndrome/lean/AbelSyndromeV33.lean'
      - '.github/workflows/invsqrt36-v33-abel-syndrome-lean.yml'
  workflow_dispatch:
jobs:
  lean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain leanprover/lean4:v4.35.0
      - name: Check V33 Abel summation by parts, quadratic transport & syndrome hub theorems
        run: ~/.elan/bin/lean research/invsqrt36_v33_abel_syndrome/lean/AbelSyndromeV33.lean
