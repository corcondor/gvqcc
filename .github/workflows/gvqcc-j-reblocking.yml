name: GVQCC global ANGLE J-width KMB reblocking sweep

on:
  push:
    branches:
      - research/claude-handoff-global-angle-20261123
  workflow_dispatch:

permissions:
  contents: read

jobs:
  real-angle-j-sweep:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python array engine
        run: python -m pip install --disable-pip-version-check numpy==2.3.5
      - name: Restore pinned public V8 words+tree (not synthetic)
        run: |
          python - <<'PY'
          import hashlib,base64,zlib,json,numpy as np
          from pathlib import Path
          f=json.loads(Path('research/claude_handoff_20261123/fixtures/V8_C46_angles_edges_b85.json').read_text())
          raw=zlib.decompress(base64.b85decode(f['payload']))
          assert hashlib.sha256(raw).hexdigest()==f['raw_sha256']
          m=int(np.prod(f['shape_words']))
          w=np.frombuffer(raw[:m],dtype=np.uint8).reshape(f['shape_words'])
          e=np.frombuffer(raw[m:],dtype=np.uint8).reshape(f['shape_edges'])
          assert w.shape==(1219,75) and e.shape==(75,2)
          np.savez_compressed('publicV8_angle_tree.npz',angle_words=w,tree_edges=e)
          print('real source SHA256',f['source_npz_sha256'])
          PY
      - name: Compile five J regroupings and verify every real KMB
        env:
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
        run: |
          python research/claude_handoff_20261123/src/j_width_real_sweep.py \
            --source publicV8_angle_tree.npz --out j_sweep_out \
            --J-list 3,4,5,6,7 --banks 3
      - name: Validate log and mark strict limitations
        run: |
          python - <<'PY'
          import json
          r=json.load(open('j_sweep_out/J_reblock_comparison.json'))
          assert not r['native_KickMix'] and not r['full_75_word_comparison']
          assert {x['J'] for x in r['results']}=={3,4,5,6,7}
          assert all(x['exact_value_phase_scratch'] and len(x['kmb_sha256'])==3 for x in r['results'])
          print(json.dumps(r['results'],indent=2))
          PY
      - name: Save real KMB and reblocking cost evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gvqcc-real-V8-J-width-3-bank-sweep
          path: j_sweep_out/
          if-no-files-found: warn
          retention-days: 14
