name: V14 joint history gauge certificates
on:
  pull_request:
  push:
    branches: [research/invsqrt36-v14-joint-history-gauge-20261124]
jobs:
  lean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain leanprover/lean4:v4.35.0
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Verify concrete donor and union certificates
        run: |
          lean +leanprover/lean4:v4.35.0 research/invsqrt36_nonlinear_lending/lean/HistoryScratchV13.lean
          lean +leanprover/lean4:v4.35.0 research/invsqrt36_nonlinear_lending/lean/MovingNonlinearGaugeV13.lean
          lean +leanprover/lean4:v4.35.0 research/invsqrt36_nonlinear_lending/lean/V14JointHistoryGauge.lean
