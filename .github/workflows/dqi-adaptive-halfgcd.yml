name: Adaptive half-GCD unified strict Lean audit
on:
  pull_request:
    paths:
      - 'research/dqi_cutoff18_strict/**'
      - 'research/dqi_adaptive_halfgcd/**'
      - '.github/workflows/dqi-adaptive-halfgcd.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lean:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: research/dqi_cutoff18_strict
    steps:
      - uses: actions/checkout@v4
      - run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain leanprover/lean4:v4.35.0
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - run: |
          set -euo pipefail
          lake update
          lake exe cache get
      - name: Check inherited and new algebraic contracts
        run: |
          set -uo pipefail
          fail=0
          for f in PackedHalfGCD AdaptiveHalfGCD ExactTransposedLagrange SchurReturn283 CrossStageNorm; do
            lake env lean -DwarningAsError=true "$f.lean" > "$f.log" 2>&1 || fail=1
            cat "$f.log"
            n=$(grep -c "^'.*axiom" "$f.log" || true)
            e=$(grep -c '^#print axioms' "$f.lean")
            test "$n" -eq "$e" || fail=1
            echo "AXIOM_ROWS $f $n/$e"
            python - "$f.log" <<'PY' || fail=1
          import re,sys
          for line in open(sys.argv[1]):
              if 'depends on axioms:' in line:
                  m=re.search(r'depends on axioms: \[(.*)\]',line)
                  assert m and set(m.group(1).split(', ')) <= {'propext','Classical.choice','Quot.sound'},line
          PY
          done
          for f in ../dqi_hmr_anf_debt/HMRDebt ../dqi_joint_gauge_tensor/JointGaugeTensor ../dqi_joint_gauge_tensor/PolarRank; do
            lake env lean -DwarningAsError=true "$f.lean" > "$(basename "$f").log" 2>&1 || fail=1
            cat "$(basename "$f").log"
            n=$(grep -c "^'.*axiom" "$(basename "$f").log" || true)
            e=$(grep -c '^#print axioms' "$f.lean")
            test "$n" -eq "$e" || fail=1
            echo "AXIOM_ROWS $f $n/$e"
            python - "$(basename "$f").log" <<'PY' || fail=1
          import re,sys
          for line in open(sys.argv[1]):
              if 'depends on axioms:' in line:
                  m=re.search(r'depends on axioms: \[(.*)\]',line)
                  assert m and set(m.group(1).split(', ')) <= {'propext','Classical.choice','Quot.sound'},line
          PY
          done
          if grep -E 'sorryAx|ofReduceBool|_native\.bv_decide\.ax' ./*.log; then fail=1; fi
          exit "$fail"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: adaptive-halfgcd-axioms
          path: research/dqi_cutoff18_strict/*.log
