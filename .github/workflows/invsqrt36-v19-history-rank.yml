name: V19 measurement history rank certificate
on:
  pull_request:
    paths:
      - 'research/invsqrt36_nonlinear_lending/lean/V19HistoryRank.lean'
      - '.github/workflows/invsqrt36-v19-history-rank.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lean:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean
        run: |
          curl -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain leanprover/lean4:v4.35.0
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - run: lean research/invsqrt36_nonlinear_lending/lean/V19HistoryRank.lean
