name: Family-C m6 row25 Lean audit
on:
  pull_request:
    paths:
      - 'research/family-c-m6-row25-20261127/**'
      - '.github/workflows/family-c-m6-row25-lean.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean 4.35.0
        run: curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain leanprover/lean4:v4.35.0
      - name: Check theorem and axiom audit
        shell: bash
        run: |
          set -euo pipefail
          ~/.elan/bin/lean --version
          ~/.elan/bin/lean -DwarningAsError=true research/family-c-m6-row25-20261127/FamilyCRow25.lean | tee lean-audit.log
          test "$(grep -c 'GVQCC.FamilyCRow25.*axiom' lean-audit.log)" -eq 13
          ! grep -E 'sorryAx|Lean.ofReduceBool' lean-audit.log
