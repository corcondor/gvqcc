name: Quantum Griffith exact-oracle tests

on:
  push:
    branches:
      - "research/quantum-griffith-logic-*"
    paths:
      - "quantum_griffith/**"
      - ".github/workflows/quantum-griffith.yml"
  pull_request:
    paths:
      - "quantum_griffith/**"
      - ".github/workflows/quantum-griffith.yml"

permissions:
  contents: read

jobs:
  exact-oracles:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Exhaustive logical and reversible oracle tests
        run: python -m unittest discover -s quantum_griffith/tests -v
      - name: Demonstrate affine reversible optimization
        run: python -m quantum_griffith --case affine-product --inputs 4 --affine-depth 2 --beam 12
      - name: Demonstrate joint output basis optimization
        run: python -m quantum_griffith --case output-mix --inputs 3 --joint --affine-depth 2 --beam 24


  differentiable-learner:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install CPU-only PyTorch for optional NN test
        run: python -m pip install --quiet torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
      - name: Check hard collapse and straight-through gradients
        run: python -m unittest quantum_griffith.tests.test_core.OptionalPyTorchTests quantum_griffith.tests.test_teacher.OptionalTorchSeedTests -v
      - name: Run short learned-LUT candidate experiment
        run: python -m quantum_griffith --case affine-product --inputs 4 --train --train-steps 60 --train-gates 6 --train-restarts 1
