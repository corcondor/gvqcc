name: Quantum Griffith - PyTorch learning and exact oracle verification

on:
  push:
    branches:
      - "research/quantum-griffith-logic-*"
    paths:
      - "quantum_griffith/**"
      - ".github/workflows/quantum-griffith.yml"
  pull_request:
    paths:
      - "quantum_griffith/**"
      - ".github/workflows/quantum-griffith.yml"

permissions:
  contents: read

jobs:
  exact-oracles:
    name: Exact oracles and all PyTorch tests (no skips)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install and verify pinned PyTorch CPU
        run: bash quantum_griffith/install-pytorch-cpu.sh
      - name: All tests with PyTorch installed
        run: python -m unittest discover -s quantum_griffith/tests -v
      - name: Demonstrate affine synthesis
        run: python -m quantum_griffith --case affine-product --inputs 4 --affine-depth 2 --beam 12
      - name: Demonstrate joint input/output basis search
        run: python -m quantum_griffith --case output-mix --inputs 3 --joint --affine-depth 2 --beam 24

  trained-neural-search:
    name: Actual multi-restart PyTorch learning (not only a smoke test)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install and verify pinned PyTorch CPU
        run: bash quantum_griffith/install-pytorch-cpu.sh
      - name: Train learned gates and wiring (affine-product)
        run: |
          set -euo pipefail
          python -m quantum_griffith --case affine-product --inputs 4 \
            --train --train-steps 400 --train-gates 12 --train-restarts 3 \
            | tee affine_train_report.json
      - name: Train learned gates and wiring (multi-output)
        run: |
          set -euo pipefail
          python -m quantum_griffith --case output-mix --inputs 3 \
            --train --train-steps 300 --train-gates 14 --train-restarts 3 --joint \
            | tee multioutput_train_report.json
      - name: PyTorch policy gradient on actual compiled quantum costs
        run: |
          set -euo pipefail
          python -m quantum_griffith --case output-mix --inputs 3 \
            --policy --policy-steps 160 --policy-batch 12 --policy-depth 2 --joint \
            | tee quantum_policy_report.json
      - name: PyTorch policy gradient on affine-product
        run: |
          set -euo pipefail
          python -m quantum_griffith --case affine-product --inputs 4 \
            --policy --policy-steps 160 --policy-batch 12 --policy-depth 2 \
            | tee affine_policy_report.json
      - name: Harder unseen random multi-output quantum cost search
        run: |
          set -euo pipefail
          python -m quantum_griffith --case random --inputs 4 --outputs 3 --seed 21 \
            --policy --policy-steps 200 --policy-batch 16 --policy-depth 3 \
            | tee random_multioutput_policy_report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quantum-griffith-pytorch-results
          if-no-files-found: warn
          path: |
            affine_train_report.json
            multioutput_train_report.json
            quantum_policy_report.json
            affine_policy_report.json
            random_multioutput_policy_report.json
