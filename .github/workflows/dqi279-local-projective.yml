name: DQI 279 local projective gauge
on:
  pull_request:
    paths:
      - 'research/dqi279_local_paid/**'
      - 'research/dqi_cutoff18_strict/ProjectiveGauge279.lean'
      - '.github/workflows/dqi279-local-projective.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lean:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: research/dqi_cutoff18_strict
    steps:
      - uses: actions/checkout@v4
      - run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain leanprover/lean4:v4.35.0
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - run: |
          set -euo pipefail
          lake update
          lake exe cache get
          lake env lean -DwarningAsError=true ProjectiveGauge279.lean | tee projective.log
          test "$(grep -c 'GVQCC.ProjectiveGauge279.*axiom' projective.log)" -eq 12
          ! grep -E 'sorryAx|ofReduceBool' projective.log
