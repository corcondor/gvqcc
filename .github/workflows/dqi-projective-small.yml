name: Projective small chart Lean
on:
  pull_request:
    paths:
      - 'research/dqi316k_projective_small/**'
      - '.github/workflows/dqi-projective-small.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lean:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain leanprover/lean4:v4.35.0
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - run: |
          set -euo pipefail
          lean -DwarningAsError=true research/dqi316k_projective_small/ProjectiveSmall.lean | tee lean.log
          if grep -E 'sorryAx|ofReduceBool' lean.log; then exit 1; fi
          test "$(grep -c 'axioms' lean.log)" -eq 8
