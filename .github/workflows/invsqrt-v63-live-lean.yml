name: V63 live chart Lean
on:
  pull_request:
    paths:
      - 'research/invsqrt-v63-live/**'
      - '.github/workflows/invsqrt-v63-live-lean.yml'
  push:
    branches: [research/invsqrt-v63-live-joint-transport-20261126]
jobs:
  lean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain leanprover/lean4:v4.35.0
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - run: lean +leanprover/lean4:v4.35.0 research/invsqrt-v63-live/V63LiveChart.lean
