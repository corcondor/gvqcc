name: V39 affine nonlinear joint certificates
on:
  pull_request:
  push:
    branches: [research/invsqrt36-v39-affine-nonlinear-joint-20261125]
jobs:
  lean-certificate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain leanprover/lean4:v4.35.0
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - run: lean +leanprover/lean4:v4.35.0 research/invsqrt36_nonlinear_lending/lean/V39AffineNonlinearJoint.lean
