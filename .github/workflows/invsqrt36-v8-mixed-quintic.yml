name: V8 mixed-guard and nested quintic identities
on:
  push:
    branches: [research/invsqrt36-v8-mixed-quintic-20261124]
  pull_request:
    paths:
      - 'research/invsqrt36_nonlinear_lending/lean/MixedQuinticV8.lean'
      - '.github/workflows/invsqrt36-v8-mixed-quintic.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain leanprover/lean4:v4.35.0
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Verify V8 local theorems
        run: lean research/invsqrt36_nonlinear_lending/lean/MixedQuinticV8.lean
