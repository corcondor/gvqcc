name: V8 mixed-guard and nested quintic identities
on:
  push:
    branches: [research/invsqrt36-v8-mixed-quintic-20261124]
  pull_request:
    paths:
      - 'research/invsqrt36_nonlinear_lending/lean/MixedQuinticV8.lean'
      - '.github/workflows/invsqrt36-v8-mixed-quintic.yml'
  workflow_dispatch:
jobs:
  lean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          auto-config: false
          use-github-cache: false
          build: false
          test: false
          lint: false
      - name: Pinned Lean 4.35.0
        run: |
          elan toolchain install leanprover/lean4:v4.35.0
          elan run leanprover/lean4:v4.35.0 lean research/invsqrt36_nonlinear_lending/lean/MixedQuinticV8.lean
