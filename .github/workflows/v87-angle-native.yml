name: V87 native ANGLE donor reconstruction and quotient synthesis
on:
  pull_request:
    paths:
      - 'research/v87/**'
      - '.github/workflows/v87-angle-native.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy
      - name: Build all 15 serialized native circuits and independently replay
        run: |
          mkdir -p out
          python -u research/v87/native.py --out out --seeds 3 2>&1 | tee out/run.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v87-native-angle-family
          path: |
            out/run.log
            out/receipt.json
            out/reference/
            out/candidate/
          if-no-files-found: warn
          retention-days: 7
