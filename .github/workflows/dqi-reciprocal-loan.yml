name: DQI reciprocal coordinate loan
on:
  pull_request:
    paths:
      - 'research/dqi_no_copy_reverse/ReciprocalLoan.lean'
      - '.github/workflows/dqi-reciprocal-loan.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lean:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain leanprover/lean4:v4.35.0
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Strict kernel and axiom audit
        working-directory: research/dqi_no_copy_reverse
        run: |
          set -euo pipefail
          lake update
          lake exe cache get
          lake env lean -DwarningAsError=true ReciprocalLoan.lean | tee loan-axioms.txt
          test "$(grep -c 'GVQCC.ReciprocalLoan.*axiom' loan-axioms.txt)" -eq 14
          ! grep -Eq 'sorryAx|ofReduceBool' loan-axioms.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reciprocal-loan-axioms
          path: research/dqi_no_copy_reverse/loan-axioms.txt
