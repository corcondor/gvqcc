name: GVQCC coefficient-program Lean
on:
  push:
    branches:
      - research/lean-coefficient-program-20261124
  pull_request:
    paths:
      - 'research/lean_coefficient_program_20261124/**'
      - '.github/workflows/gvqcc-coefficient-program.yml'
jobs:
  lean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain leanprover/lean4:v4.35.0
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Kernel check and executable acceptance tests
        working-directory: research/lean_coefficient_program_20261124
        run: |
          lean --version
          if grep -nE '\b(sorry|admit|axiom|native_decide)\b' GVQCCProgram.lean; then exit 1; fi
          lean -o GVQCCProgram.olean GVQCCProgram.lean
          export LEAN_PATH=.
          lean Main.lean
          printf '5 15 1\n10 12 0 0 0\n10 12 8 8 0\n49 0 1 4\n33 4 2\n33 4 3\n80 4 0\n160 0 1 0\n' > ok.txt
          lean --run Main.lean ok.txt
          sed '$d' ok.txt > bad.txt
          if lean --run Main.lean bad.txt; then exit 1; fi
