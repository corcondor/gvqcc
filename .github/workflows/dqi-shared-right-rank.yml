name: DQI shared-right grouped update Lean
on:
  pull_request:
    paths:
      - 'research/dqi_shared_right_rank/**'
      - '.github/workflows/dqi-shared-right-rank.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  strict:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: |
          set -euo pipefail
          curl -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain leanprover/lean4:v4.35.0
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - run: |
          set -euo pipefail
          lean -DwarningAsError=true research/dqi_shared_right_rank/SharedRight.lean | tee proof.log
          test "$(grep -Ec 'depends on axioms|does not depend on any axioms' proof.log)" -eq 6
          ! grep -E 'sorryAx|native_decide|ofReduceBool' proof.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shared-right-proof
          path: proof.log
