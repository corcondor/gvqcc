name: DQI repeated node ring equivalence
on:
  pull_request:
    paths:
      - 'research/dqi_cf_native_proof/JetRing.lean'
      - '.github/workflows/dqi-cf-jet-ring.yml'
permissions:
  contents: read
jobs:
  lean:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean 4.35.0
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain leanprover/lean4:v4.35.0
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Check ring equivalence with pinned mathlib
        run: |
          set -euo pipefail
          cd research/dqi_cf_native_proof
          cat > lakefile.toml <<'EOF'
          name = "jet_ring"
          version = "0.1.0"
          defaultTargets = ["JetRing"]
          [[require]]
          name = "mathlib"
          git = "https://github.com/leanprover-community/mathlib4.git"
          rev = "v4.35.0"
          [[lean_lib]]
          name = "JetRing"
          EOF
          echo 'leanprover/lean4:v4.35.0' > lean-toolchain
          lake update
          lake exe cache get
          lake env lean -DwarningAsError=true JetRing.lean | tee ring-axioms.txt
          if grep -Eq 'sorryAx|Lean.ofReduceBool|Lean.trustCompiler' ring-axioms.txt; then exit 1; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jet-ring-axioms
          path: research/dqi_cf_native_proof/ring-axioms.txt
