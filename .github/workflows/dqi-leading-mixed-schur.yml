name: DQI leading and mixed Schur proof
on:
  pull_request:
    paths:
      - 'research/dqi_cutoff18_strict/LeadingMixedSchur.lean'
      - 'research/dqi257_leading_schur/**'
      - '.github/workflows/dqi-leading-mixed-schur.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lean:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: research/dqi_cutoff18_strict
    steps:
      - uses: actions/checkout@v4
      - run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain leanprover/lean4:v4.35.0
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - run: |
          set -euo pipefail
          lake update
          lake exe cache get
          lake env lean -DwarningAsError=true LeadingMixedSchur.lean | tee leading.log
          test "$(grep -c 'GVQCC.LeadingMixedSchur.*axiom' leading.log)" -eq 12
          ! grep -E 'sorryAx|ofReduceBool' leading.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: leading-mixed-schur-axioms
          path: research/dqi_cutoff18_strict/leading.log
