name: V64 temporal Horner local certificates
on:
  push:
    branches: [research/invsqrt-v64-temporal-horner-phase-20261126]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain leanprover/lean4:v4.35.0
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - run: lean +leanprover/lean4:v4.35.0 research/invsqrt-v64-temporal/V64TemporalHorner.lean
