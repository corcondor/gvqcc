name: chemistry stationary algebra
on:
  pull_request:
    paths:
      - 'research/chemistry_stationary_tensor_20261126/**'
      - '.github/workflows/chemistry-stationary-algebra.yml'
  workflow_dispatch:
jobs:
  algebra:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 research/chemistry_stationary_tensor_20261126/stationary_core.py
      - name: Install pinned Lean and check identities
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain leanprover/lean4:v4.35.0
          "$HOME/.elan/bin/lean" research/chemistry_stationary_tensor_20261126/StationaryTransport.lean
