name: DQI adaptive pair and all-pole CRT
on:
  pull_request:
    paths:
      - 'research/dqi_cutoff18_strict/AdaptivePairCRT.lean'
      - 'research/dqi_cutoff18_strict/adaptive_pair_crt/**'
      - '.github/workflows/dqi-adaptive-pair-crt.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain leanprover/lean4:v4.35.0
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Strict kernel and axiom audit
        working-directory: research/dqi_cutoff18_strict
        run: |
          set -euo pipefail
          lake update
          lake exe cache get
          lake env lean -DwarningAsError=true AdaptivePairCRT.lean | tee adaptive-pair-axioms.log
          test "$(grep -c 'GVQCC.AdaptivePairCRT.*axiom' adaptive-pair-axioms.log)" -eq 16
          ! grep -E 'sorryAx|ofReduceBool' adaptive-pair-axioms.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: adaptive-pair-axioms
          path: research/dqi_cutoff18_strict/adaptive-pair-axioms.log
