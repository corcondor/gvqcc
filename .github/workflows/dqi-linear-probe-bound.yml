name: DQI linear probe bound
on:
  push:
    branches: [research/dqi-v110-phase-witness-repair-20261128]
    paths:
      - 'research/dqi_v110_phase_witness_repair/filtered_guard/LinearProbeBound.lean'
      - '.github/workflows/dqi-linear-probe-bound.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  kernel:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain leanprover/lean4:v4.35.0
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - run: |
          set -euo pipefail
          lean -DwarningAsError=true research/dqi_v110_phase_witness_repair/filtered_guard/LinearProbeBound.lean | tee proof.log
          grep 'split_difference' proof.log
          ! grep -E 'sorryAx|ofReduceBool|Lean.ofReduce' proof.log
