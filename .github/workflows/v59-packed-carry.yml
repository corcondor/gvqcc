name: V59 packed carry finite identities
on:
  push:
    paths: ['research/invsqrt-v59/**', '.github/workflows/v59-packed-carry.yml']
  pull_request:
    paths: ['research/invsqrt-v59/**', '.github/workflows/v59-packed-carry.yml']
jobs:
  identities:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain leanprover/lean4:v4.35.0
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - run: lean research/invsqrt-v59/CarryTransducer.lean
