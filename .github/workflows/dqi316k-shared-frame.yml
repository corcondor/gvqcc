name: DQI316K shared frame transport
on:
  pull_request:
    paths:
      - 'research/dqi316k_joint_crt/SharedFrame316.lean'
      - 'research/dqi316k_joint_crt/d16_shared_frame.py'
      - '.github/workflows/dqi316k-shared-frame.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  strict:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain leanprover/lean4:v4.35.0
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Check algebraic transport
        run: |
          set -euo pipefail
          lean -DwarningAsError=true research/dqi316k_joint_crt/SharedFrame316.lean | tee shared-frame.log
          test "$(grep -c 'axiom' shared-frame.log)" -eq 8
          ! grep -E 'sorryAx|ofReduceBool|native_decide' shared-frame.log
