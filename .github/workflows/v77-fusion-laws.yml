name: V77 fusion local algebra
on:
  pull_request:
    paths:
      - 'research/v77/**'
      - '.github/workflows/v77-fusion-laws.yml'
  workflow_dispatch:
jobs:
  local:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 research/v77/marked_ladder.py
      - name: Lean local algebra
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain leanprover/lean4:v4.35.0
          "$HOME/.elan/bin/lean" research/v77/FusionLaws.lean
