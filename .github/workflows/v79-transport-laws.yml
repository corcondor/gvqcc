name: V79 transport local algebra
on:
  pull_request:
    paths:
      - 'research/v79/**'
      - '.github/workflows/v79-transport-laws.yml'
  workflow_dispatch:
jobs:
  lean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean 4.35.0
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain leanprover/lean4:v4.35.0
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - run: lean research/v79/TransportLaws.lean
