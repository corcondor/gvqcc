name: V78 local algebra
on:
  pull_request:
    paths:
      - 'research/v78/**'
      - '.github/workflows/v78-lean.yml'
  workflow_dispatch:
jobs:
  lean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean 4.35.0
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y --default-toolchain leanprover/lean4:v4.35.0
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Check algebra
        run: |
          lean --version
          lean research/v78/AdaptiveQuotient.lean
