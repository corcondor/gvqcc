name: V43 physical tensor DAG certificate
on:
  pull_request:
    paths:
      - 'research/invsqrt36_nonlinear_lending/lean/V43PhysicalTensorDAG.lean'
      - '.github/workflows/invsqrt36-v43-physical-tensor-dag.yml'
  push:
    branches: [research/invsqrt36-v43-physical-tensor-dag-20261125]
jobs:
  lean-certificate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain leanprover/lean4:v4.35.0
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - run: lean +leanprover/lean4:v4.35.0 research/invsqrt36_nonlinear_lending/lean/V43PhysicalTensorDAG.lean
