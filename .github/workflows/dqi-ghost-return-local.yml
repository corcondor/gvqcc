name: Gray128 local ghost return
on:
  pull_request:
    paths:
      - 'research/dqi_cutoff18_strict/GhostReturnLocal.lean'
      - '.github/workflows/dqi-ghost-return-local.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain leanprover/lean4:v4.35.0
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - working-directory: research/dqi_cutoff18_strict
        run: |
          set -euo pipefail
          lake update
          lake exe cache get
          lake env lean -DwarningAsError=true GhostReturnLocal.lean | tee ghost_return.log
          python3 - <<'PY'
          import re
          s=open('ghost_return.log').read()
          rows=re.findall(r'depends on axioms: \[([^\]]*)\]',s)
          assert len(rows)+len(re.findall(r'does not depend on any axioms',s))==9
          for row in rows:
              assert {x.strip() for x in row.split(',') if x.strip()} <= {'propext','Classical.choice','Quot.sound'},row
          PY
