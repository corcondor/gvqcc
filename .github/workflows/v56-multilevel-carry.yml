name: V56 multilevel carry certificates
on:
  push:
    branches: ['research/invsqrt-v56-multilevel-carry-20261125']
    paths:
      - 'research/invsqrt36_nonlinear_lending/lean/V56MultilevelCarry.lean'
      - '.github/workflows/v56-multilevel-carry.yml'
  pull_request:
    paths:
      - 'research/invsqrt36_nonlinear_lending/lean/V56MultilevelCarry.lean'
      - '.github/workflows/v56-multilevel-carry.yml'
jobs:
  lean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean 4.35.0
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain leanprover/lean4:v4.35.0
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - run: lean research/invsqrt36_nonlinear_lending/lean/V56MultilevelCarry.lean
