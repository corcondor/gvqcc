name: V7 guarded phase basis Lean 4
on:
  pull_request:
    paths:
      - 'research/invsqrt36_nonlinear_lending/lean/GlobalPhaseBasisV7.lean'
      - '.github/workflows/invsqrt36-v7-phase-basis-lean.yml'
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain leanprover/lean4:v4.35.0
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Check concrete certificates
        run: |
          lean --version
          lean research/invsqrt36_nonlinear_lending/lean/GlobalPhaseBasisV7.lean
