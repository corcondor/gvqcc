name: GVQCC public compiler archive smoke test
on:
  push:
    branches: [experiments/k8-multipath-20261123]
    paths: [.github/workflows/public_compiler_archive.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  independent-open-source-test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Archive pinned public compiler sources
        run: |
          git clone https://github.com/manwithacat/kickmix-engine.git /tmp/engine
          git -C /tmp/engine checkout 166b61d2e0a7404ace8acf62a6f269105e6b97f1
          git clone https://github.com/manwithacat/vqcc-tools.git /tmp/tools
          git -C /tmp/tools checkout cd4b30f6806b13096ab0d30946f38c8c9548dfa7
          printf 'engine: ';git -C /tmp/engine rev-parse HEAD
          printf 'tools: ';git -C /tmp/tools rev-parse HEAD
      - name: Test Claude-authored qrom-plan Rust implementation
        run: cargo test --manifest-path /tmp/engine/Cargo.toml -p qrom-plan -- --nocapture
      - name: Test published reversible AND construction
        run: python3 -m pip install -q numpy && python3 -m unittest discover -s /tmp/tools/tools/dfthc-refit -p test_chained_and.py -v
      - name: Save source versions and run metadata
        if: always()
        run: |
          mkdir -p archive_receipt
          git -C /tmp/engine rev-parse HEAD > archive_receipt/kickmix-engine.sha
          git -C /tmp/tools rev-parse HEAD > archive_receipt/vqcc-tools.sha
          printf 'Original public V8 k8 SHA256: 227472385bffce8eb08c31ee93d635755901b29107bb32177885e1b7e212f898\n' > archive_receipt/baseline.txt
          printf 'These tests verify upstream tools on their own tests, not k8<211 or a competition score.\n' >> archive_receipt/baseline.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: archive-compiler-smoke-receipts
          path: archive_receipt/
          retention-days: 7
