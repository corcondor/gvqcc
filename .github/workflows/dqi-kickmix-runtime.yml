name: DQI pinned KickMix runtime artifact
on:
  pull_request:
    paths:
      - '.github/workflows/dqi-kickmix-runtime.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip download --no-deps --only-binary=:all: kickmix==1.0.0 -d /tmp/runtime
      - run: sha256sum /tmp/runtime/*.whl
      - uses: actions/upload-artifact@v4
        with:
          name: pinned-kickmix-cp313
          path: /tmp/runtime/*.whl
          if-no-files-found: error
