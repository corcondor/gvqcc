name: V58 factored carry algebra
on:
  push:
    branches: [research/invsqrt-v58-factored-carry-interval-20261125]
  pull_request:
    paths: ['research/invsqrt-v58-factored/**', '.github/workflows/v58-factored.yml']
jobs:
  lean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain leanprover/lean4:v4.35.0
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - run: lean +leanprover/lean4:v4.35.0 research/invsqrt-v58-factored/V58FactoredCarry.lean
