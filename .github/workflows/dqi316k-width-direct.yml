name: DQI 316k direct width Lean audit
on:
  pull_request:
    paths:
      - 'research/dqi316k_width_direct/**'
      - '.github/workflows/dqi316k-width-direct.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lean:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain leanprover/lean4:v4.35.0
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Kernel and axiom audit
        run: |
          set -euo pipefail
          lean -DwarningAsError=true research/dqi316k_width_direct/WidthDirect.lean | tee width-axioms.txt
          test "$(grep -c 'GVQCC.DQI316Width.*axiom' width-axioms.txt)" -eq 9
          ! grep -E 'sorryAx|ofReduceBool' width-axioms.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: width-axioms
          path: width-axioms.txt
