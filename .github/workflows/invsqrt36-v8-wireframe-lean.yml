name: V8 wire frame Lean
on:
  push:
    branches: [research/invsqrt36-v8-wireframe-20261124]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lean:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean
        run: |
          curl -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain leanprover/lean4:v4.35.0
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Compile
        run: |
          lean research/invsqrt36_nonlinear_lending/lean/WireFrameV8.lean
          lean research/invsqrt36_nonlinear_lending/lean/PeerV8.lean
