name: DQI316K conditional HMR proof
on:
  pull_request:
    paths:
      - 'research/dqi316k_joint_hmr/**'
      - '.github/workflows/dqi316k-joint-hmr.yml'
  workflow_dispatch:
jobs:
  lean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain leanprover/lean4:v4.35.0
          "$HOME/.elan/bin/lean" -DwarningAsError=true research/dqi316k_joint_hmr/ConditionalHMR.lean
