name: DQI257 affine transport and acceptance
on:
  pull_request:
    paths:
      - 'research/dqi257_direct_repair/**'
      - '.github/workflows/dqi257-affine-gate.yml'
permissions:
  contents: read
jobs:
  lean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain leanprover/lean4:v4.35.0
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - run: |
          set -euo pipefail
          lean -DwarningAsError=true research/dqi257_direct_repair/AffineGate257.lean | tee /tmp/lean257.log
          ! grep -E 'sorryAx|ofReduceBool' /tmp/lean257.log
