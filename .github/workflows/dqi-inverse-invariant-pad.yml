name: DQI 316k invariant pad local laws
on:
  pull_request:
    paths:
      - 'research/dqi_cutoff18_strict/InvariantPad.lean'
      - '.github/workflows/dqi-inverse-invariant-pad.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lean:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain leanprover/lean4:v4.35.0
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Strict kernel and axiom audit
        working-directory: research/dqi_cutoff18_strict
        run: |
          set -euo pipefail
          lake update
          lake exe cache get
          lake env lean -DwarningAsError=true InvariantPad.lean | tee invariant-pad-axioms.txt
          test "$(grep -c 'GVQCC.InvariantPad.*axiom' invariant-pad-axioms.txt)" -eq 11
          ! grep -Eq 'sorryAx|ofReduceBool' invariant-pad-axioms.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: invariant-pad-axioms
          path: research/dqi_cutoff18_strict/invariant-pad-axioms.txt
