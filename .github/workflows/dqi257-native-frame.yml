name: DQI 257 native frame identities
on:
  pull_request:
    paths:
      - 'research/dqi_cutoff18_strict/NativeFrame257.lean'
      - '.github/workflows/dqi257-native-frame.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lean:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: research/dqi_cutoff18_strict
    steps:
      - uses: actions/checkout@v4
      - run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain leanprover/lean4:v4.35.0
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - run: |
          set -euo pipefail
          lake update
          lake exe cache get
          lake env lean -DwarningAsError=true NativeFrame257.lean | tee native-frame.log
          test "$(grep -c 'GVQCC.NativeFrame257.*axiom' native-frame.log)" -eq 4
          ! grep -E 'sorryAx|ofReduceBool' native-frame.log
