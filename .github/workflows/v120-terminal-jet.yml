name: V120 terminal jet strict Lean audit
on:
  pull_request:
    paths:
      - 'research/v120_terminal_jet/**'
      - '.github/workflows/v120-terminal-jet.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lean:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain leanprover/lean4:v4.35.0
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Kernel and axiom audit
        working-directory: research/v119_terminal_pole
        run: |
          set -euo pipefail
          lake update
          lake exe cache get
          lake env lean -DwarningAsError=true ../v120_terminal_jet/TerminalJet.lean | tee v120-axioms.txt
          if grep -Eq 'sorryAx|ofReduceBool' v120-axioms.txt; then exit 1; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v120-axioms
          path: research/v119_terminal_pole/v120-axioms.txt
