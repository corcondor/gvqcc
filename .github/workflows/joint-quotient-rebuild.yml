name: Joint quotient reconstruction
on:
  pull_request:
    paths:
      - 'research/joint_quotient_rebuild/**'
      - '.github/workflows/joint-quotient-rebuild.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean 4.35.0
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain leanprover/lean4:v4.35.0
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Check Lean and independent exhaustive tests
        working-directory: research/joint_quotient_rebuild
        run: |
          set -euo pipefail
          lean -DwarningAsError=true JointQuotient.lean | tee axioms.txt
          test "$(grep -c 'GVQCC.JointQuotient.*axiom' axioms.txt)" -eq 7
          ! grep -Eq 'sorryAx|ofReduceBool' axioms.txt
          python test_quotient.py
      - uses: actions/upload-artifact@v4
        with:
          name: quotient-proof-receipt
          path: |
            research/joint_quotient_rebuild/axioms.txt
            research/joint_quotient_rebuild/test_quotient.json
