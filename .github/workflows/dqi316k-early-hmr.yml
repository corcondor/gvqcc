name: DQI 316k early HMR SSA Lean audit
on:
  pull_request:
    paths:
      - 'research/dqi316k_early_hmr/**'
      - '.github/workflows/dqi316k-early-hmr.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lean:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain leanprover/lean4:v4.35.0
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Kernel and axiom audit
        run: |
          set -euo pipefail
          lean -DwarningAsError=true research/dqi316k_early_hmr/EarlyHMR.lean | tee early-axioms.txt
          test "$(grep -c 'GVQCC.EarlyHMR.*axiom' early-axioms.txt)" -eq 8
          ! grep -E 'sorryAx|ofReduceBool' early-axioms.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: early-axioms
          path: early-axioms.txt
