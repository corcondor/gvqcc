name: Frobenius packed return native and strict algebra
on:
  pull_request:
    paths:
      - 'research/dqi_frobenius_packed_return/**'
      - 'research/dqi_cutoff18_strict/FrobeniusPackedReturn.lean'
      - '.github/workflows/dqi-frobenius-packed-return.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install kickmix==1.0.0 numpy==2.2.6
      - run: python research/dqi_frobenius_packed_return/reference_solve.py
      - run: python research/dqi_frobenius_packed_return/packed_return.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frobenius-return-native
          path: |
            research/dqi_frobenius_packed_return/*.kmb
            research/dqi_frobenius_packed_return/*receipt.json
  lean:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain leanprover/lean4:v4.35.0
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Strict proof and axioms
        working-directory: research/dqi_cutoff18_strict
        run: |
          set -euo pipefail
          lake update
          lake exe cache get
          lake env lean -DwarningAsError=true FrobeniusPackedReturn.lean | tee frobenius.log
          python3 - <<'PY'
          import re
          s=open('frobenius.log').read()
          rows=re.findall(r'depends on axioms: \[([^\]]*)\]',s)
          closed=re.findall(r'does not depend on any axioms',s)
          assert len(rows)+len(closed)==8,(rows,closed)
          for row in rows:
              assert {x.strip() for x in row.split(',') if x.strip()} <= {'propext','Classical.choice','Quot.sound'},row
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frobenius-return-lean
          path: research/dqi_cutoff18_strict/frobenius.log
