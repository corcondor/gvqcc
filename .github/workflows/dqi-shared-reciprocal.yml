name: DQI shared reciprocal and nonmonic seam
on:
  pull_request:
    paths:
      - 'research/dqi_cutoff18_strict/SharedReciprocal.lean'
      - 'research/dqi271_shared_reciprocal/**'
      - '.github/workflows/dqi-shared-reciprocal.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lean:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: research/dqi_cutoff18_strict
    steps:
      - uses: actions/checkout@v4
      - run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain leanprover/lean4:v4.35.0
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - run: |
          set -euo pipefail
          lake update
          lake exe cache get
          lake env lean -DwarningAsError=true SharedReciprocal.lean | tee shared.log
          test "$(grep -c 'GVQCC.SharedReciprocal.*axiom' shared.log)" -eq 12
          ! grep -E 'sorryAx|ofReduceBool' shared.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shared-reciprocal-axioms
          path: research/dqi_cutoff18_strict/shared.log
