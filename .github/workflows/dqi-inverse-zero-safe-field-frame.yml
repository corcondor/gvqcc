name: DQI 316k zero safe field frame
on:
  pull_request:
    paths:
      - 'research/dqi_cutoff18_strict/ZeroSafeFieldFrame.lean'
      - '.github/workflows/dqi-inverse-zero-safe-field-frame.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lean:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain leanprover/lean4:v4.35.0
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Strict kernel and axiom audit
        working-directory: research/dqi_cutoff18_strict
        run: |
          set -euo pipefail
          lake update
          lake exe cache get
          lake env lean -DwarningAsError=true ZeroSafeFieldFrame.lean | tee zero-safe-field-frame-axioms.txt
          test "$(grep -c 'GVQCC.ZeroSafeFieldFrame.*axiom' zero-safe-field-frame-axioms.txt)" -eq 6
          ! grep -Eq 'sorryAx|ofReduceBool' zero-safe-field-frame-axioms.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zero-safe-field-frame-axioms
          path: research/dqi_cutoff18_strict/zero-safe-field-frame-axioms.txt
