name: Coherent cursor strict algebra
on:
  pull_request:
    paths:
      - 'research/dqi_coherent_cursor/**'
      - '.github/workflows/dqi-coherent-cursor.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lean:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain leanprover/lean4:v4.35.0
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - run: |
          set -euo pipefail
          lean -DwarningAsError=true research/dqi_coherent_cursor/CoherentCursor.lean | tee proof.log
          test "$(grep -Ec 'depends on axioms|does not depend on any axioms' proof.log)" -eq 13
          ! grep -E 'sorryAx|ofReduceBool|Lean.ofReduce' proof.log
          python - <<'PY'
          import re
          for row in re.findall(r'depends on axioms: \[([^\]]*)\]',open('proof.log').read()):
              assert {s.strip() for s in row.split(',') if s.strip()} <= {'propext','Classical.choice','Quot.sound'}
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: coherent-cursor-proof
          path: proof.log
