name: Validate DQI analysis tools

on:
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

jobs:
  cpu-verification:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned native circuit engine
        run: python3 -m pip install --disable-pip-version-check kickmix==1.0.0 numpy==2.5.4
      - name: Test binary parser and conservative analysis
        run: python3 -m unittest discover -p 'test_*.py' -v
      - name: Verify joint angle-word and generic KMX research contracts
        run: |
          python3 research/test_joint_word_feedback.py
          python3 research/test_generic_angle_loader.py
      - name: Validate multi-angle compilers, including native KMX parser
        run: |
          python3 research/test_multi_angle_synthesis.py -v
          python3 -m py_compile research/multi_angle_synthesis.py
      - name: Verify pattern library mathematical contracts
        run: python3 research/patterns/test_structural_pattern_library.py
      - name: Check v3 HMR, affine, partition, and wire-permutation oracles
        run: |
          python3 research/multiangle_v3/test_new_patterns.py -v
          python3 research/multiangle_v3/test_partition_and_permutation.py -v
          python3 -m py_compile research/multiangle_v3/*.py
      - name: Check exhaustive and symbolic Boolean analysis
        run: |
          python3 test_boolean_block_analyze.py
          python3 test_symbolic_block_analyze.py
      - name: Verify specialized finite-field kernels
        run: python3 inverse_specialized.py
      - name: Recompute inverse scheduling choices
        run: python3 pebble_search.py
      - name: Verify complete inverse gate circuits
        run: python3 full_inverse_verify.py
      - name: Save calculation results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dqi-arithmetic-verification
          path: |
            inverse_specialized_results.json
            pebble_results.json
            full_inverse_verify_results.json
          if-no-files-found: error
          retention-days: 14
