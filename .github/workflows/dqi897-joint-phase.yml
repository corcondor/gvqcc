name: DQI897 masked phase transport
on:
  pull_request:
    paths:
      - 'research/dqi897_joint/**'
      - '.github/workflows/dqi897-joint-phase.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lean:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean
        run: |
          curl -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain leanprover/lean4:v4.35.0
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Verify local phase proof
        run: |
          set -euo pipefail
          lean -DwarningAsError=true research/dqi897_joint/PhaseTransport.lean | tee phase-audit.log
          ! grep -E 'sorryAx|Lean.ofReduceBool' phase-audit.log
