name: Dependent affine shear exact whole tape scan
on:
  pull_request:
    paths:
      - 'research/dqi_transported_hole_chart/dependent_shears.cpp'
      - '.github/workflows/dqi-dependent-shears.yml'
  workflow_dispatch:
    inputs:
      source_run:
        required: false
        description: Run containing pinned #314 or #279 KMB
      source_artifact:
        required: false
        description: Artifact name
permissions:
  contents: read
  actions: read
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.source_artifact || 'exact-257-fft-research' }}
          run-id: ${{ inputs.source_run || '46121065738' }}
          github-token: ${{ github.token }}
          path: /tmp/deps
      - name: Compile and run exact synthesis
        run: |
          set -euo pipefail
          mkdir -p /tmp/results
          pip install kickmix==1.0.0 numpy==2.2.6 scipy
          g++ -std=c++17 -O3 research/dqi_transported_hole_chart/dependent_shears.cpp -o /tmp/shears
          /tmp/shears --selftest
          python - <<'PY'
          from pathlib import Path
          import hashlib
          pins={'518d634ede9dcf7e78a8e91264db25d544f54bf3c86caee7ebc355f618a66499','994ac1f372211f3599912ab7aeba8063e5332190c904769de853c58bdb600fff'}
          for p in Path('/tmp/deps').rglob('*.kmb'):
              h=hashlib.file_digest(p.open('rb'),'sha256').hexdigest()
              if h in pins:
                  Path('/tmp/parent_path').write_text(str(p)); print('exact parent',h,p); break
          else: raise SystemExit('No exact supported complete KMB')
          PY
          /tmp/shears "$(cat /tmp/parent_path)" /tmp/results/dqi.kmb /tmp/results/sites.tsv | tee /tmp/results/scan.json
          sha256sum "$(cat /tmp/parent_path)" /tmp/results/dqi.kmb > /tmp/results/full_hashes.txt
          python - <<'PY'
          import kickmix as km,json
          r=json.load(open('/tmp/results/scan.json'))
          a=km.Circuit.from_file(open('/tmp/parent_path').read())
          b=km.Circuit.from_file('/tmp/results/dqi.kmb')
          assert a.num_qubits==b.num_qubits==r['q']
          assert len(a)==r['old_ops'] and len(b)==r['new_ops']
          assert int(a.operation_statistics().num_toffoli_like)-int(b.operation_statistics().num_toffoli_like)==r['saved_static_paid']
          PY
      - name: Paired native replay
        run: |
          set -euo pipefail
          if [ ! -s /tmp/results/sites.tsv ]; then echo 'No accepted contraction; unchanged circuit.'; exit 0; fi
          curl -fLsS --retry 2 'https://raw.githubusercontent.com/corcondor/gvqcc/932eb4194f662827f9d90257e5981a710318e3da/research/cross_task_live_tensor_20261128/verify_dqi.py' -o /tmp/verify_dqi.py
          python /tmp/verify_dqi.py "$(cat /tmp/parent_path)" /tmp/results/dqi.kmb
          cp /tmp/dual_receipt.json /tmp/results/dual_receipt.json
          python - <<'PY'
          import json
          a,b=json.load(open('/tmp/results/dual_receipt.json')).values()
          print('native receipt:',a['panels'],b['panels'])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependent-shears-exact-research
          path: /tmp/results/
          compression-level: 3
