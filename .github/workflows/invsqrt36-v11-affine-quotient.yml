name: V11 affine quotient certificates
on:
  push:
    branches: [research/invsqrt36-v11-affine-quotient-20261124]
  pull_request:
    paths:
      - 'research/invsqrt36_nonlinear_lending/lean/AffineQuotientV11.lean'
      - '.github/workflows/invsqrt36-v11-affine-quotient.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lean:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install pinned Lean
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain leanprover/lean4:v4.35.0
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Verify local certificates
        run: lean research/invsqrt36_nonlinear_lending/lean/AffineQuotientV11.lean
