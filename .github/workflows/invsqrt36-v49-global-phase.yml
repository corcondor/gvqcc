name: V49 global phase Lean certificates
on:
  pull_request:
    paths:
      - 'research/invsqrt36_nonlinear_lending/lean/V49GlobalPhasePredictor.lean'
      - '.github/workflows/invsqrt36-v49-global-phase.yml'
  workflow_dispatch:
jobs:
  lean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain leanprover/lean4:v4.35.0
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - run: lean research/invsqrt36_nonlinear_lending/lean/V49GlobalPhasePredictor.lean
