name: V127 adaptive ladder Lean audit
on:
  pull_request:
    paths:
      - 'research/v127-adaptive-ladder/**'
      - '.github/workflows/v127-adaptive-ladder.yml'
permissions:
  contents: read
jobs:
  lean:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean
        run: |
          curl -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain leanprover/lean4:v4.35.0
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Check proof
        run: |
          set -euo pipefail
          lean -DwarningAsError=true research/v127-adaptive-ladder/HybridLadder.lean | tee v127-lean.log
          ! grep -E 'sorryAx|Lean.ofReduceBool' v127-lean.log
