name: Joint hub Lean certificates
on:
  push:
    branches: [research/invsqrt36-joint-hub-certificates-20261124]
  pull_request:
  workflow_dispatch:
jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean 4.35.0
        run: |
          curl -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.35.0
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Phase-derived hub
        run: lean research/invsqrt36_nonlinear_lending/lean/PhaseDerivedHub.lean
      - name: Nine actual gap transports
        run: lean research/invsqrt36_nonlinear_lending/lean/JointHubTransport.lean
