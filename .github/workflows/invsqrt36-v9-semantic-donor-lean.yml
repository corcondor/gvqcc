name: V9 semantic donor Lean certificate
on:
  push:
    branches: [research/invsqrt36-v9-semantic-donor-transfer-20261124]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lean:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install pinned Lean
        run: |
          curl -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain leanprover/lean4:v4.35.0
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Check the eight actual conditional identities and resources
        run: lean research/invsqrt36_nonlinear_lending/lean/SemanticDonorV9.lean
