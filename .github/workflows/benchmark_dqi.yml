name: Reproduce and benchmark DQI candidate

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full-dqi-verification:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned circuit engine
        run: python3 -m pip install --disable-pip-version-check kickmix==1.0.0 numpy==2.5.4
      - name: Build and verify the pinned candidate on CPU
        run: python3 -u reproduce_dqi_candidate.py --work-dir "$RUNNER_TEMP/gvqcc_dqi_benchmark"
      - name: Save verification evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dqi-full-verification
          path: |
            ${{ runner.temp }}/gvqcc_dqi_benchmark/*.json
            ${{ runner.temp }}/gvqcc_dqi_benchmark/gauge128/gauge_pieces.json
          if-no-files-found: warn
          retention-days: 14
