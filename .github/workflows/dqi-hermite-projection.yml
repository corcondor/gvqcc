name: DQI 316k Hermite projection local laws
on:
  pull_request:
    paths:
      - 'research/dqi_cutoff18_strict/HermiteProjection.lean'
      - '.github/workflows/dqi-hermite-projection.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lean:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain leanprover/lean4:v4.35.0
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Strict kernel and axiom audit
        working-directory: research/dqi_cutoff18_strict
        run: |
          set -euo pipefail
          lake update
          lake exe cache get
          lake env lean -DwarningAsError=true HermiteProjection.lean | tee hermite-axioms.txt
          test "$(grep -c 'GVQCC.HermiteProjection.*axiom' hermite-axioms.txt)" -eq 9
          ! grep -Eq 'sorryAx|ofReduceBool' hermite-axioms.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hermite-projection-axioms
          path: research/dqi_cutoff18_strict/hermite-axioms.txt
