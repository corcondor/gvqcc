name: V67 Bilinear Karatsuba & Tensor QROM Lean
on:
  pull_request:
    paths:
      - 'research/invsqrt36_v67_bilinear_tensor/lean/V67BilinearKaratsuba.lean'
      - '.github/workflows/invsqrt36-v67-bilinear-tensor-lean.yml'
  workflow_dispatch:
jobs:
  lean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain leanprover/lean4:v4.35.0
      - name: Check V67 Karatsuba, paired rank-2 bilinear, and 24-segment don't-care theorems
        run: ~/.elan/bin/lean research/invsqrt36_v67_bilinear_tensor/lean/V67BilinearKaratsuba.lean
