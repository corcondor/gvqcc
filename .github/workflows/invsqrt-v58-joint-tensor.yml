name: V58 local tensor identities
on:
  push:
    branches: [research/invsqrt-v58-joint-tensor-phase-20261125]
  pull_request:
    paths:
      - research/invsqrt36_nonlinear_lending/lean/V58JointTensor.lean
      - .github/workflows/invsqrt-v58-joint-tensor.yml
jobs:
  lean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain leanprover/lean4:v4.35.0
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - run: lean +leanprover/lean4:v4.35.0 research/invsqrt36_nonlinear_lending/lean/V58JointTensor.lean
