name: DQI paid norm proof
on:
  pull_request:
    paths:
      - 'research/dqi_cf_native_proof/**'
      - '.github/workflows/dqi-paid-norm.yml'
permissions:
  contents: read
jobs:
  lean:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean 4.35.0
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain leanprover/lean4:v4.35.0
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Compile and audit
        run: |
          set -euo pipefail
          cd research/dqi_cf_native_proof
          lean --version
          lean -DwarningAsError=true -o NativeProof.olean NativeProof.lean | tee native-axioms.txt
          LEAN_PATH=. lean -DwarningAsError=true PaidNorm.lean | tee paid-norm-axioms.txt
          if grep -Eq 'sorryAx|Lean.ofReduceBool|Lean.trustCompiler' native-axioms.txt paid-norm-axioms.txt; then exit 1; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: paid-norm-axioms
          path: research/dqi_cf_native_proof/*axioms.txt
