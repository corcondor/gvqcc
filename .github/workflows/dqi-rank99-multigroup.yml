name: Rank99 multigroup and exact transported-chart ANF
on:
  pull_request:
    paths:
      - 'research/dqi_rank99_multigroup/**'
      - '.github/workflows/dqi-rank99-multigroup.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lean:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain leanprover/lean4:v4.35.0
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - run: |
          set -euo pipefail
          lean -DwarningAsError=true research/dqi_rank99_multigroup/Rank99MultiGroup.lean | tee proof.log
          test "$(grep -Ec 'depends on axioms|does not depend on any axioms' proof.log)" -eq 13
          python - <<'PY'
          import re
          s=open('proof.log').read()
          for row in re.findall(r'depends on axioms: \[([^\]]*)\]',s):
              assert {x.strip() for x in row.split(',') if x.strip()} <= {'propext','Classical.choice','Quot.sound'}, row
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rank99-multigroup-proof
          path: proof.log
