name: V116 direct codec strict Lean audit
on:
  pull_request:
    paths:
      - 'research/v116_strict_audit/**'
      - '.github/workflows/v116-strict-audit.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lean:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain leanprover/lean4:v4.35.0
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Kernel and axiom audit
        working-directory: research/v115_dqi_correctness/lean
        run: |
          set -euo pipefail
          lake update
          lake exe cache get
          lake env lean -DwarningAsError=true ../../v116_strict_audit/DirectCodec.lean | tee lean-v116-axioms.txt
          if grep -Eq 'sorryAx|ofReduceBool' lean-v116-axioms.txt; then exit 1; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v116-lean-axioms
          path: research/v115_dqi_correctness/lean/lean-v116-axioms.txt
