name: V119 terminal pole strict Lean audit
on:
  pull_request:
    paths:
      - 'research/v119_terminal_pole/**'
      - '.github/workflows/v119-terminal-pole.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lean:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain leanprover/lean4:v4.35.0
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Kernel and axiom audit
        working-directory: research/v119_terminal_pole
        run: |
          set -euo pipefail
          lake update
          lake exe cache get
          lake env lean -DwarningAsError=true TerminalPole.lean | tee proof.log
          test "$(grep -c 'GVQCC.V119.*axiom' proof.log)" -eq 9
          ! grep -E 'sorryAx|Lean.ofReduceBool' proof.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v119-proof-log
          path: research/v119_terminal_pole/proof.log
