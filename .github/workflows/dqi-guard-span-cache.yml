name: DQI guard-span cache proof
on:
  pull_request:
    paths:
      - 'research/dqi_guard_span_cache/**'
      - '.github/workflows/dqi-guard-span-cache.yml'
  workflow_dispatch:
jobs:
  lean-strict:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean 4.35.0
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain leanprover/lean4:v4.35.0
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Kernel check and axiom audit
        shell: bash
        run: |
          set -euo pipefail
          lean -DwarningAsError=true research/dqi_guard_span_cache/GuardSpanCache.lean | tee proof.log
          if grep -E 'sorryAx|ofReduceBool|_native_decide' proof.log; then exit 1; fi
          test "$(grep -Ec 'depends on axioms|does not depend on any axioms' proof.log)" -eq 15
