name: DQI 316k tensor rank schedule
on:
  pull_request:
    paths:
      - 'research/dqi_cutoff18_strict/TensorRank.lean'
      - '.github/workflows/dqi-inverse-tensor-rank.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lean:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain leanprover/lean4:v4.35.0
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Strict kernel and axiom audit
        working-directory: research/dqi_cutoff18_strict
        run: |
          set -euo pipefail
          lake update
          lake exe cache get
          lake env lean -DwarningAsError=true TensorRank.lean | tee tensor-rank-axioms.txt
          test "$(grep -c 'GVQCC.TensorRank.*axiom' tensor-rank-axioms.txt)" -eq 6
          ! grep -Eq 'sorryAx|ofReduceBool' tensor-rank-axioms.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tensor-rank-axioms
          path: research/dqi_cutoff18_strict/tensor-rank-axioms.txt
